name: Backstage IDP CI/CD pipeline
on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Shorten Commit_Id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> ${GITHUB_ENV}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: aumthakkar/py6app:${{ env.COMMIT_ID }}

    outputs:
      commit_id: ${{ env.COMMIT_ID }}

  cd:
    needs: ci
    runs-on: orbstack-runner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # - name: Install and run yq utility to edit tag value with commit_id
      #   run: |
      #     sudo apt update && sudo apt install python3-pip -y
      #     pip install yq --break-system-packages
      #     yq -Yi '.image.tag = ${{ needs.ci.outputs.commit_id }}' charts/py6app/values.yaml

      - name: Install yq (Binary)
        run: |
          sudo apt-get update && sudo apt-get install -y wget
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_arm64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update Tag
        run: yq -i '.image.tag = "${{ needs.ci.outputs.commit_id }}"' charts/py6app/values.yaml

      - name: Commit Changes to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          message: "pushed the image with tag: ${{ needs.ci.outputs.commit_id }}"

      - name: Install ArgoCD CLI and sync app
        run: |
          VERSION=$(curl -L -s https://raw.githubusercontent.com/argoproj/argo-cd/stable/VERSION)
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/download/v$VERSION/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          sudo chmod +x /usr/local/bin/argocd
          sudo rm argocd-linux-amd64

          argocd login argocd-server.argocd \
          --username ${{ secrets.ARGOCD_USERNAME }} \
          --password ${{ secrets.ARGOCD_PASSWORD }} \
          --grpc-web \
          --insecure

          argocd app sync py6app

          # REPO="https://github.com/aumthakkar/may26-py6app.git"
          # argocd app create py6app \
          # --dest-server https://kubernetes.default.svc \
          # --path charts/py6app \
          # --repo ${REPO} \
          # --revision main \
          # --sync-option CreateNamespace=true \
          # --sync-policy manual \
          # --values charts/py6app/values.yaml







        
